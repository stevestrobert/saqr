name: pages

# Publishes the static site to Cloudflare Pages: landing page, web deck (+ PDFs, script, presenter notes) and the
# server-less dashboard (static bundle replaying a run recorded by `saqr snapshot`).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    paths:
      - "docs/**"
      - "frontend/**"
      - "saqr/**"
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROJECT: saqr-hackathon

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install SAQR
        run: pip install -e .
      - name: Export the deck to PDF (3-minute cut and full version)
        run: |
          python docs/presentation/build.py --pdf
          python docs/presentation/build.py --pdf --full
      - name: Record a full demo run for the server-less dashboard
        run: saqr snapshot var/snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: |
            docs/presentation/SAQR-pitch.pdf
            docs/presentation/SAQR-pitch-full.pdf
            var/snapshot
          if-no-files-found: error

  deploy:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: rendered
          path: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the static dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build:static
      - name: Assemble the site
        run: python3 docs/presentation/site.py
      - name: Secrets present?
        id: secrets
        env:
          HAS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "ok=$HAS" >> "$GITHUB_OUTPUT"
          [ "$HAS" = "true" ] || echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — site built but not deployed"
      - name: Create the Pages project if it does not exist
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy var/site --project-name="$PROJECT" --branch=main --commit-dirty=true
