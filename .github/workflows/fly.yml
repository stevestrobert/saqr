name: fly

# Deploys the real SAQR node (Docker image from ./Dockerfile) to Fly.io: https://saqr-hackathon.fly.dev
# Needs the repository secret FLY_API_TOKEN (a Fly deploy token). The Pages site stays static; this is the live system.

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: fly
  cancel-in-progress: false

env:
  APP: saqr-hackathon
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secret present?
        id: secret
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::FLY_API_TOKEN not set — not deploying"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.secret.outputs.ok == 'true'
      - name: Create the app if it does not exist
        if: steps.secret.outputs.ok == 'true'
        run: |
          if ! flyctl status --app "$APP" >/dev/null 2>&1; then
            flyctl apps create "$APP" --org personal || flyctl apps create "$APP"
          fi
      - name: Deploy
        if: steps.secret.outputs.ok == 'true'
        run: flyctl deploy --remote-only --app "$APP" --ha=false --wait-timeout 10m
      - name: Smoke test
        if: steps.secret.outputs.ok == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP.fly.dev/api/status" >/dev/null; then echo "up: https://$APP.fly.dev"; exit 0; fi
            sleep 10
          done
          echo "node did not answer in time"; exit 1
