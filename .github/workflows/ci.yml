name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container:
      # Chromium preinstalled; the playwright pin in pyproject.toml must match this image version.
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: pip install -e ".[dev]"
      - name: Browser matches the installed Playwright
        run: python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); print(b.version); b.close(); p.stop()"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check saqr tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build
