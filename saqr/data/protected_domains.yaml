# Protected registry: official UAE government financial-service properties.
#
# This list is the whitelist (nothing here, nor any subdomain of it, is ever flagged or blocked)
# AND the brand vocabulary the look-alike matcher protects. Each entity lists:
#   domains  - official registrable domains (allow-listed together with every subdomain)
#   brands   - tokens that identify the entity inside a domain name. Tokens marked ambiguous are short or
#              common (rta, moi, tax) and only count strongly together with a financial keyword / government cue.
#   names    - English / Arabic names used by the page-text analyser
#   services - what the entity collects money for (used by the lure lexicon and the demo scenario)
#
# Official suffixes below are allow-listed wholesale: a name under them cannot be registered by an attacker.
official_suffixes: [gov.ae, mil.ae, ac.ae, sch.ae]

entities:
  - id: rta
    name: Roads and Transport Authority (Dubai)
    name_ar: هيئة الطرق والمواصلات
    sector: transport
    domains: [rta.ae, nol.ae]
    brands: [rta, nol, rtadubai]
    ambiguous: [rta, nol]
    services: [traffic fines, parking fines, nol card top-up, vehicle registration renewal, driving licence renewal]
  - id: salik
    name: Salik (Dubai toll)
    name_ar: سالك
