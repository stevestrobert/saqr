# Context tokens. Alone they are weak; together with a brand they are strong.
government_cues: [gov, govt, government, uae, emirates, emirate, dubai, abudhabi, sharjah, ajman, rak, fujairah, federal,
                  ministry, authority, official, portal, eservices, eservice, smart, national, ae]

# Financial / lure keywords. "strong" ones are the classic payment-scam vocabulary.
financial_keywords:
  strong: [fine, fines, refund, refunds, violation, violations, penalty, penalties, toll, tolls, customs, redelivery,
           overdue, unpaid, mukhalafat, mukhalafa, gharama, gharamat, istirdad]
  normal: [pay, payment, payments, fee, fees, tax, taxes, vat, traffic, renew, renewal, bill, bills, invoice, duty,
           charge, charges, balance, recharge, topup, top-up, wallet, settle, settlement, due, mulkiya, license, licence,
           permit, visa, residency, grant, benefit, pension, salary, zakat, dirham, aed, secure, verify, verification,
           claim, delivery, parcel, shipment, suspended, blocked, outstanding, account, login, signin, update, service,
           services, rusoom, rasoom, dareeba, tajdeed, dafa, daf3]

risky_tlds: [top, xyz, shop, online, site, club, icu, live, click, link, buzz, work, rest, cfd, sbs, cam, monster, quest,
             cyou, tk, ml, ga, cf, gq, info, biz, vip, pro, store, fun, space, website, tech, pw, cc, su, ru, lol, bond,
             best, today, world, zone, support, help, center, services]

# Certificate authorities that issue free, automated certificates (common in phishing; a weak signal on its own).
free_cas: ["Let's Encrypt", "ZeroSSL", "Google Trust Services", "Buypass", "SSL.com", "Actalis", "cPanel", "GoGetSSL", "TrustAsia", "Sectigo (free)"]
